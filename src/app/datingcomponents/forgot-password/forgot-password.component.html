<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Forgot Password?</h5>
          <p class="text-muted mb-4">
            Enter your email address and we'll send you a link to reset your
            password.
          </p>

          <!-- Success Alert -->
          <div
            class="alert alert-success alert-dismissible fade show"
            role="alert"
            *ngIf="showSuccessAlert"
          >
            <i class="bi bi-check-circle me-2"></i>
            {{ successMessage }}
            <button
              type="button"
              class="btn-close"
              (click)="closeAlert('success')"
            ></button>
          </div>

          <!-- Error Alert -->
          <div
            class="alert alert-danger alert-dismissible fade show"
            role="alert"
            *ngIf="errors['form']"
          >
            <i class="bi bi-exclamation-circle me-2"></i>
            {{ errors["form"] }}
            <button
              type="button"
              class="btn-close"
              (click)="closeAlert('error')"
            ></button>
          </div>

          <form (ngSubmit)="onSubmit()" novalidate>
            <!-- Email Field -->
            <div class="mb-3">
              <label for="email" class="form-label">Email address *</label>
              <input
                type="email"
                id="email"
                name="email"
                [(ngModel)]="email"
                placeholder="Enter your email"
                (blur)="onFieldBlur('email')"
                (change)="validateEmail()"
                required
                class="form-control"
                [class.is-invalid]="touched['email'] && errors['email']"
                [class.is-valid]="touched['email'] && !errors['email'] && email"
                [disabled]="isSubmitting"
              />
              <div class="invalid-feedback d-block" *ngIf="errors['email']">
                <i class="bi bi-exclamation-circle"></i> {{ errors["email"] }}
              </div>
              <div
                class="valid-feedback d-block"
                *ngIf="touched['email'] && !errors['email'] && email"
              >
                <i class="bi bi-check-circle"></i> Email is valid
              </div>
              <small class="form-text text-muted">
                We'll send a password reset link to this email address.
              </small>
            </div>

            <!-- Submit Button -->
            <button
              type="submit"
              class="btn btn-danger w-100 mb-2"
              [disabled]="!isFormValid() || isSubmitting"
            >
              <span *ngIf="!isSubmitting">Send Reset Link</span>
              <span *ngIf="isSubmitting">
                <span
                  class="spinner-border spinner-border-sm me-2"
                  role="status"
                  aria-hidden="true"
                ></span>
                Sending...
              </span>
            </button>

            <!-- Back to Login -->
            <button
              type="button"
              class="btn btn-outline-secondary w-100"
              (click)="goToLogin()"
              [disabled]="isSubmitting"
            >
              Back to Login
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
